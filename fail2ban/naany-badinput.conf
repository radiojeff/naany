# fail2ban filter for NAANY's process.php abuse log.
#
# Matches lines written by log_bad_input() in process.php when an upload
# fails the early ADIF content-sniff test, e.g.:
#   [2026-10-03T16:24:36+00:00] NAANY_BADINPUT ip=203.0.113.7 reason=not-adif callsign=W6OAT ua=curl/7.81.0
#
# Install:
#   sudo cp naany-badinput.conf /etc/fail2ban/filter.d/naany-badinput.conf
#
# Verify the regex (and date detection) against the real log before
# enabling the jail:
#   fail2ban-regex /var/log/naany/badinput.log /etc/fail2ban/filter.d/naany-badinput.conf
#
# No explicit datepattern is set -- fail2ban's default date autodetection
# recognizes the bracketed ISO 8601 timestamp process.php writes (PHP's
# date('c')) without needing one. Add a datepattern here only if
# fail2ban-regex shows it isn't picking the timestamp up correctly.

[Definition]

failregex = ^\[.*\]\s+NAANY_BADINPUT\s+ip=<HOST>\s+reason=\S+.*$

ignoreregex =
