# fail2ban jail for NAANY's abuse log -- bans IPs whose uploads repeatedly
# fail the ADIF content-sniff test in process.php (see
# naany-badinput.conf in this same directory for the matching filter).
#
# Install:
#   sudo mkdir -p /var/log/naany
#   sudo chown www-data:www-data /var/log/naany   # adjust to your PHP user
#   sudo chmod 750 /var/log/naany
#   sudo cp naany-badinput.conf /etc/fail2ban/filter.d/naany-badinput.conf
#   sudo cp naany.conf /etc/fail2ban/jail.d/naany.conf
#   sudo fail2ban-client -d                       # dry-run config check
#   sudo systemctl restart fail2ban
#
# Confirm it's loaded and watch it work:
#   sudo fail2ban-client status naany-badinput
#
# To unban (important to know before you need it -- a false positive
# bans real users too):
#   sudo fail2ban-client set naany-badinput unbanip <IP>
#
# Tuning: starts conservative on purpose. maxretry=1 (ban on the very
# first bad upload) is tempting but risky -- a single false positive
# (e.g. a legitimate ADIF with an unusually large free-text header
# before the first <eoh>/<eor>) would lock out a real user immediately.
# Watch it run for a while with these settings before tightening.
#
# action uses iptables-allports (a stock fail2ban action, not something
# you need to write) so a banned IP is dropped on every port, not just
# this app's -- matching "they simply cannot access the server."

[naany-badinput]
enabled  = true
filter   = naany-badinput
logpath  = /var/log/naany/badinput.log
maxretry = 4
findtime = 10m
bantime  = 1h
action   = iptables-allports[name=naany-badinput, protocol=tcp]
